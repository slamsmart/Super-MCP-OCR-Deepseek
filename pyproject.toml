[project]
name = "mcp-ocr"
version = "1.2.0"
description = "MCP OCR server — memberi 'mata' ke LLM teks-only (DeepSeek dll): baca gambar + pdf + dokumen Office (docx/xlsx/pptx/rtf) + teks, dengan fallback tesseract"
requires-python = ">=3.10,<3.14"
dependencies = [
    "mcp==1.12.0",
    "rapidocr-onnxruntime>=1.3.20",
    "Pillow>=10.0",
    "numpy>=1.26",
    "pypdfium2>=4.30",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
    "striprtf>=0.0.26",
]

[project.optional-dependencies]
# Mode ringan (tanpa onnxruntime / pypdfium2): OCR lewat CLI tesseract + poppler.
# Butuh: apt-get install -y tesseract-ocr tesseract-ocr-ind poppler-utils
lite = ["mcp==1.12.0", "Pillow>=10.0", "numpy>=1.26"]

[tool.uv]
package = false
