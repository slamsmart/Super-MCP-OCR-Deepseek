[project]
name = "mcp-ocr"
version = "1.1.0"
description = "MCP OCR server — memberi 'mata' ke LLM teks-only (DeepSeek dll): baca gambar + pdf + dokumen Office (docx/xlsx/pptx/rtf) + teks"
requires-python = ">=3.10,<3.14"
dependencies = [
    "mcp==1.12.0",
    "rapidocr-onnxruntime>=1.3.20",
    "Pillow>=10.0",
    "numpy>=1.26",
    "pypdfium2>=4.30",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
    "striprtf>=0.0.26",
]

[tool.uv]
package = false
